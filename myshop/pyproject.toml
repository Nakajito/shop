[project]
name = "myshop"
version = "0.1.0"
description = "One Synk — Django 5 e-commerce platform (Korean food storefront)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.0,<5.1",
    "django-allauth>=65.15.0",
    "django-celery-results>=2.6.0",
    "django-ckeditor-5>=0.2.20",
    "django-widget-tweaks>=1.5.1",
    "celery>=5.6.3",
    "flower>=2.0.1",
    "redis>=7.0.0",
    "psycopg2-binary>=2.9.10",
    "dj-database-url>=3.1.0",
    "python-decouple>=3.8",
    "stripe>=14.0.0",
    "weasyprint>=68.0",
    "pillow>=12.0.0",
    "whitenoise>=6.8.0",
    "gunicorn>=23.0.0",
    "sentry-sdk>=2.19.0",
    "humanize>=4.15.0",
    "requests>=2.32.0",
    "pyjwt>=2.11",
    "cryptography>=46",
    "oauthlib>=3",
    "requests-oauthlib>=2",
]

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "djlint>=1.36.4",
    "pre-commit>=4.6.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "static", "staticfiles", "media"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "DJ",
    "UP",
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "DJ001",  # nullable string fields — pre-existing schema, requires migrations to fix
    "DJ012",  # model body ordering — cosmetic
]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]
"**/apps.py" = ["F401"]   # signals imports for side effects

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120

[tool.coverage.run]
source = [
    "accounts", "shop", "cart", "orders",
    "payment", "coupons", "support", "blog",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "manage.py",
    "myshop/wsgi.py",
    "myshop/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
