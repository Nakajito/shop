{% load i18n %}
{% with request.resolver_match.view_name as current_view %}

<div class="card border-0 shadow-sm sk-sidebar">
  <div class="card-header bg-white">
    <h6 class="mb-0 fw-bold text-uppercase small text-muted">{% trans "Mi Cuenta" %}</h6>
  </div>

  <div class="list-group list-group-flush">

    <a href="{% url 'accounts:profile' %}"
       class="list-group-item list-group-item-action border-0 {% if 'accounts:profile' in current_view %}active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      {% trans "Mi Perfil" %}
    </a>

    <a href="{% url 'orders:order_history' %}"
       class="list-group-item list-group-item-action border-0 {% if 'orders:order_history' in current_view %}active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      {% trans "Mis Pedidos" %}
    </a>

    <a href="{% url 'shop:favorite_list' %}"
       class="list-group-item list-group-item-action border-0 {% if 'shop:favorite_list' in current_view %}active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      {% trans "Mis Favoritos" %}
    </a>

    <a href="{% url 'orders:address_list' %}"
       class="list-group-item list-group-item-action border-0 {% if 'orders:address' in current_view %}active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      {% trans "Direcciones" %}
    </a>

    <a href="{% url 'payment:payment_method_list' %}"
       class="list-group-item list-group-item-action border-0 {% if 'payment:payment_method' in current_view %}active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      {% trans "Métodos de Pago" %}
    </a>

    <a href="{% url 'support:ticket_list' %}"
       class="list-group-item list-group-item-action border-0 {% if 'support:' in current_view %}active{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      {% trans "Soporte" %}
    </a>

  </div>

  <div class="card-footer bg-white border-0">
    <form action="{% url 'accounts:logout' %}" method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-link p-0 text-decoration-none small fw-bold">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        {% trans "Cerrar Sesión" %}
      </button>
    </form>
  </div>
</div>

{% endwith %}
