name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Django tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myshop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.13

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi-dev \
            shared-mime-info libgdk-pixbuf-2.0-0

      - name: Sync project dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check

      # Informational only for now: the baseline already carries known Django
      # CVEs that only 5.2/6.0 fix (out of range for our pinned django<5.1 —
      # see SECURITY.md). Flip to blocking once that upgrade lands.
      - name: Dependency vulnerability audit (pip-audit)
        continue-on-error: true
        run: uv run --with pip-audit pip-audit

      - name: Django check
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.testing
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_API_VERSION: "2024-04-10"
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          EMAIL_HOST_USER: test@example.com
          EMAIL_HOST_PASSWORD: dummy
          DEFAULT_FROM_EMAIL: test@example.com
        run: uv run python manage.py check

      - name: Django deploy check (production settings)
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.production
          SECRET_KEY: ci-dummy-secret-key-for-deploy-check-only
          ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          DATABASE_URL: postgres://user:pass@localhost:5432/dummy
          RESEND_API_KEY: re_dummy
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_API_VERSION: "2024-04-10"
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          EMAIL_HOST_USER: test@example.com
          EMAIL_HOST_PASSWORD: dummy
          DEFAULT_FROM_EMAIL: test@example.com
        run: uv run python manage.py check --deploy

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.testing
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_API_VERSION: "2024-04-10"
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          EMAIL_HOST_USER: test@example.com
          EMAIL_HOST_PASSWORD: dummy
          DEFAULT_FROM_EMAIL: test@example.com
        run: |
          uv run coverage run manage.py test
          uv run coverage report --fail-under=78
          uv run coverage xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: myshop/coverage.xml
          if-no-files-found: ignore

  # No build-and-push / deploy jobs: Coolify's GitHub App integration builds
  # straight from this repo's Dockerfile and redeploys on push by itself.
