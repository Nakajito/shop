name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Django tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myshop

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.13

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libffi-dev \
            shared-mime-info libgdk-pixbuf-2.0-0

      - name: Sync project dependencies
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check

      - name: Django check
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.testing
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_API_VERSION: "2024-04-10"
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          EMAIL_HOST_USER: test@example.com
          EMAIL_HOST_PASSWORD: dummy
          DEFAULT_FROM_EMAIL: test@example.com
        run: uv run python manage.py check

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: myshop.settings.testing
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_API_VERSION: "2024-04-10"
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          EMAIL_HOST_USER: test@example.com
          EMAIL_HOST_PASSWORD: dummy
          DEFAULT_FROM_EMAIL: test@example.com
        run: |
          uv run coverage run manage.py test
          uv run coverage report --fail-under=78
          uv run coverage xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: myshop/coverage.xml
          if-no-files-found: ignore

  build-and-push:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          fi
          # GHCR repository names must be lowercase; github.repository keeps
          # the owner's actual casing (Nakajito/shop), which fails the build.
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ steps.tag.outputs.repo }}:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify deploy
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            URL="${{ secrets.COOLIFY_WEBHOOK_URL_PROD }}"
          else
            URL="${{ secrets.COOLIFY_WEBHOOK_URL_STAGING }}"
          fi
          curl --fail-with-body -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
